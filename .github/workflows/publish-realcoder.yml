name: Publish RealCoder

on:
  push:
    branches: [main]
    paths:
      - 'real-coder/**'
      - '.github/workflows/publish-realcoder.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-realcoder
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: real-coder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: real-coder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run lint && npm run build

      - name: Package extension
        run: npx @vscode/vsce package --out /tmp/realcoder.vsix

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Publish to the VS Code Marketplace
        run: npx @vscode/vsce publish --skip-duplicate -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Commit release metadata
        working-directory: .
        run: |
          VERSION=$(node -p "require('./real-coder/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add real-coder/package.json real-coder/package-lock.json
          git commit -m "chore(release): realcoder v$VERSION [skip ci]" || exit 0
          git push
